# Builds and tests pushes to main and pull requests. Only pushes to main retain the installer artifact.
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Build all (plugins, payload, installer)
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
      - name: Test workspace
        run: cargo test --workspace
      - name: Test rust-search
        run: cargo test
        working-directory: plugins/rust-search
      - name: Build offline language package
        run: powershell -ExecutionPolicy Bypass -File scripts\package.ps1
      - name: Test translation audit tool
        run: python -m unittest discover -s scripts -p test_i18n_catalog.py
      - name: Audit language catalogs
        run: |
          python scripts/i18n-catalog.py audit --catalog locales/pt-BR.json --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/i18n-catalog.py audit --catalog locales/ja.json --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: WinRust
          path: |
            target/release/plugin-launcher.exe
            dist/WinRust-with-languages.zip
